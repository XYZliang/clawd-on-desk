<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45"><style>@keyframes breathe{0%{transform:translateY(0)}50%{transform:translateY(-.3px)}}@keyframes blink{0%,92%{transform:scaleY(1)}95%{transform:scaleY(.1)}}#body-js{animation:breathe 3s ease-in-out infinite}#eyes-js{transform-origin:7.5px 4px;animation:blink 4s ease-in-out infinite}</style><g style="transform-origin:7.5px 15px" id="shadow-js"><ellipse cx="7.5" cy="16" fill="rgba(0,0,0,0.15)" rx="6" ry="1.5"/></g><g id="body-js"><rect width="13" height="16" x="1" y="-2" fill="#ccc" stroke="#999" stroke-width=".5" rx="3"/><rect width="4" height="2" x="2" y="13" fill="#bbb" rx="1"/><rect width="4" height="2" x="9" y="13" fill="#bbb" rx="1"/></g><g id="eyes-js"><circle cx="5" cy="4" r="1.2" fill="#333"/><circle cx="10" cy="4" r="1.2" fill="#333"/></g></svg>