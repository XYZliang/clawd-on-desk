<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes shadow-sway{0%,50%{transform:translateX(0) scaleX(1);opacity:.5}22%,30%{transform:translateX(-.5px) scaleX(.85);opacity:.45}70%,78%{transform:translateX(.5px) scaleX(.85);opacity:.45}}@keyframes body-sway{0%{transform:rotate(0deg) translateY(0)}22%,30%{transform:rotate(-6deg) translateY(.3px)}50%{transform:rotate(0deg) translateY(-.2px)}70%,78%{transform:rotate(6deg) translateY(.3px)}}@keyframes leg-right-inner{0%,50%,70%,78%{transform:rotate(0deg) translateY(0)}22%,30%{transform:rotate(-12deg) translateY(-.2px)}}@keyframes leg-right-outer{0%,50%,70%,78%{transform:rotate(0deg) translateY(0)}22%,30%{transform:rotate(-22deg) translateY(-.3px)}}@keyframes leg-left-inner{0%,22%,30%,50%{transform:rotate(0deg) translateY(0)}70%,78%{transform:rotate(12deg) translateY(-.2px)}}@keyframes leg-left-outer{0%,22%,30%,50%{transform:rotate(0deg) translateY(0)}70%,78%{transform:rotate(22deg) translateY(-.3px)}}@keyframes arm-left-dance{0%,50%{transform:rotate(0deg)}22%,30%{transform:rotate(-30deg)}70%,78%{transform:rotate(20deg)}}@keyframes arm-right-dance{0%,50%{transform:rotate(0deg)}22%,30%{transform:rotate(-20deg)}70%,78%{transform:rotate(30deg)}}@keyframes earcup-squeeze{0%{transform:scaleX(1)}22%,30%,70%,78%{transform:scaleX(.85)}50%{transform:scaleX(1.02)}}@keyframes note-left{0%,14%,42%{opacity:0;transform:translate(0,0)}22%{opacity:1;transform:translate(-.4px,-1.2px)}38%{opacity:0;transform:translate(-1.6px,-3.5px)}}@keyframes note-right{0%,62%,82%{opacity:0;transform:translate(0,0)}70%{opacity:1;transform:translate(.4px,-1.2px)}78%{opacity:0;transform:translate(1.6px,-3.5px)}}.shadow-sway{transform-box:fill-box;transform-origin:50% 50%;animation:shadow-sway 1.6s infinite ease-in-out}.body-sway{transform-origin:7.5px 13px;animation:body-sway 1.6s infinite ease-in-out}.leg-left-inner,.leg-left-outer,.leg-right-inner,.leg-right-outer{transform-box:fill-box;transfo