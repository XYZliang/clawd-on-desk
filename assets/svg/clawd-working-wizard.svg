<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes hunch-walk{0%{transform:translate(-2px,1px) rotate(2deg)}14%{transform:translate(3px,1px) rotate(2deg)}28%,72%{transform:translate(0,1px) rotate(2deg)}87%{transform:translate(-3px,1px) rotate(2deg)}}@keyframes leg-step{0%,14%,28%,72%,86%{transform:rotate(0deg) scaleY(1)}21%,7%,79%,93%{transform:rotate(-25deg) scaleY(.7)}}@keyframes shadow-walk{0%{transform:translateX(-2px) scale(.9);opacity:.4}14%{transform:translateX(3px) scale(.9);opacity:.4}28%,72%{transform:translateX(0) scale(.9);opacity:.4}87%{transform:translateX(-3px) scale(.9);opacity:.4}}@keyframes hat-drop{0%,28%,72%{transform:translate(0,0)}35%{transform:translate(.42px,1px)}42%,55%{transform:translate(.7px,2px)}58%{transform:translate(.315px,1.2px)}63%{transform:translate(.105px,.35px)}67%{transform:translate(0,-.35px)}70%{transform:translate(0,.15px)}}@keyframes hat-scale{0%,28%,58%,67%,72%{transform:scale(1)}35%{transform:scale(1.0495)}42%,55%{transform:scale(1.11)}}@keyframes hat-tilt{0%,28%,72%{transform:rotate(0deg)}35%{transform:rotate(3.15deg)}42%,55%{transform:rotate(7.5deg)}58%{transform:rotate(-3deg)}63%{transform:rotate(2.1deg)}67%{transform:rotate(-1deg)}70%{transform:rotate(.5deg)}}@keyframes hat-crown-magic{0%,55%,72%{transform:rotate(0deg) translateY(0)}58%{transform:rotate(-2deg) translateY(-.15px)}62%{transform:rotate(3deg) translateY(-.35px)}66%{transform:rotate(-1.5deg) translateY(-.15px)}70%{transform:rotate(.8deg) translateY(0)}}@keyframes hat-stars-magic{0%,52%,58%,64%,72%{opacity:1}55%{opacity:.35}61%{opacity:.45}}@keyframes brim-tilt{0%,28%,72%{transform:rotate(0deg)}35%{transform:rotate(3.15deg)}42%,55%{transform:rotate(7deg)}58%{transform:rotate(-1.5deg)}63%{transform:rotate(1.4deg)}67%{transform:rotate(-.6deg)}70%{transform:rotate(.3deg)}}@keyframes brim-center-sag{0%,28%,72%{transform:translateY(0)}35%{transform:translateY(.2px)}42%,55%{transform:translateY(.4px)}58%{transform:translateY(.24px)}63%{transform:translateY(.25px)}67%{transform:translateY(.1px)}}@keyframes brim-side-fall{0%,28%,35%,42%,55%,58%,63%,67%,72%{transform:translateY(0)}}@keyframes arm-fix{0%,38%,67%{transform:rotate(0deg)}45%,50%,62%{transform:translate(-2px,-3px) rotate(-90deg)}55%{transform:translate(-2px,-3px) rotate(-100deg)}58%{transform:translate(-2px,-3px) rotate(-80deg)}}@keyframes eyes-wizard{0%,28%,88%{transform:translateX(2px) scaleY(1)}32%,38%,58%{transform:translateX(0) scaleY(1)}62%{transform:translate(0,-.25px) scaleY(1)}66%{transform:translate(0,-.15px) scaleY(1.12)}70%{transform:translateX(0) scaleY(.1)}73%{transform:translateX(0) scaleY(1.08)}78%{transform:translateX(-.7px) scaleY(1)}82%{transform:translateX(.4px) scaleY(1)}}@keyframes eyes-user-hover{0%,45%{transform:translateX(0) scaleY(1)}55%{transform:translateX(0) scaleY(.18)}70%{transform:translateX(0) scaleY(1.08)}}@keyframes magic-sparkle-a{0%,47%{opacity:0;transform:translate(0,0)}50%{opacity:1;transform:translate(0,0)}58%{opacity:1;transform:translate(-1.6px,-2.2px)}66%{opacity:0;transform:translate(-2.6px,-3.6px)}}@keyframes magic-sparkle-b{0%,50%{opacity:0;transform:translate(0,0)}54%{opacity:1;transform:translate(0,0)}62%{opacity:1;transform:translate(1.7px,-1.8px)}70%{opacity:0;transform:translate(2.8px,-3px)}}@keyframes magic-sparkle-c{0%,52%{opacity:0;transform:translate(0,0)}56%{opacity:1;transform:translate(0,0)}64%{opacity:.8;transform:translate(-.8px,-2.8px)}72%{opacity:0;transform:translate(-1.2px,-3.8px)}}@keyframes magic-sparkle-d{0%,53%{opacity:0;transform:translate(0,0)}58%{opacity:1;transform:translate(0,0)}66%{opacity:.7;transform:translate(2.2px,-1px)}72%{opacity:0;transform:translate(3.4px,-1.8px)}}@keyframes magic-sparkle-e{0%,56%{opacity:0;transform:translate(0,0)}60%{opacity:1;transform:translate(0,0)}68%{opacity:.8;transform:translate(-1.8px,.8px)}74%{opacity:0;transform:translate(-2.8px,1.2px)}}.body-hunch{transform-origin:7.5px 15px;animation:hunch-walk 7s infinite ease-in-out}.leg-step{transform-origin:top center;transform-box:fill-box}.leg-1,.leg-2{animation:leg-step 7s infinite linear}.leg-2{animation-delay:-.245s}.shadow-walk{transform-origin:7.5px 15.5px;animation:shadow-walk 7s infinite ease-in-out}.hat-drop,.hat-scale{transform-origin:7.5px 6px;animation:hat-drop 7s infinite ease-in-out}.hat-scale{animation:hat-scale 7s infinite ease-in-out}.hat-tilt{transform-origin:7.5px 5px;animation:hat-tilt 7s infinite ease-in-out}.hat-crown-magic{transform-origin:7.5px 1px;animation:hat-crown-magic 7s infinite ease-in-out}.hat-stars-magic{animation:hat-stars-magic 7s infinite ease-in-out}.brim-center,.brim-tilt{transform-origin:7.5px 5.5px}.brim-tilt{animation:brim-tilt 7s infinite ease-in-out}.brim-center{animation:brim-center-sag 7s infinite ease-in-out}.brim-side{animation:brim-side-fall 7s infinite ease-in-out}.arm-fix{transform-origin:13px 10px;animation:arm-fix 7s infinite ease-in-out}.eyes-wizard{transform-origin:7.5px 9px;animation:eyes-wizard 7s infinite ease-in-out}svg:hover .eyes-wizard{animation:eyes-user-hover .9s infinite ease-in-out}.magic-sparkle-a{animation:magic-sparkle-a 7s infinite ease-in-out;opacity:0}.magic-sparkle-b{animation:magic-sparkle-b 7s infinite ease-in-out;opacity:0}.magic-sparkle-c{animation:magic-sparkle-c 7s infinite ease-in-out;opacity:0}.magic-sparkle-d{animation:magic-sparkle-d 7s infinite ease-in-out;opacity:0}.magic-sparkle-e{animation:magic-sparkle-e 7s infinite ease-in-out;opacity:0}</style></defs><rect id="ground-shadow" width="9" height="1" x="3" y="15" fill="#000" class="shadow-walk" opacity=".5"/><g class="body-hunch"><g id="legs" fill="#DE886D"><rect width="1" height="2" x="3" y="13" class="leg-step leg-1"/><rect width="1" height="2" x="5" y="13" class="leg-step leg-2"/><rect width="1" height="2" x="9" y="13" class="leg-step leg-1"/><rect width="1" height="2" x="11" y="13" class="leg-step leg-2"/></g><g id="body-color-group" fill="#DE886D"><rect id="torso" width="11" he