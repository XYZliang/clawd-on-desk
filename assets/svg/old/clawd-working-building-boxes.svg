<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes walk-bob{0%,30%,50%,80%{transform:translateY(0)}15%,65%{transform:translateY(-.3px)}}@keyframes breathe{0%{transform:scale(1,1) translate(0,0)}50%{transform:scale(1.02,.98) translate(0,.5px)}}@keyframes eyes-look{0%,50%{transform:translate(.3px,-1px)}25%{transform:translate(-.3px,-1px)}68%,85%{transform:translate(0,-1px)}73%,80%{transform:translate(0,.3px)}}@keyframes blink{0%,8%{transform:scaleY(1)}4%{transform:scaleY(.1)}}@keyframes shadow-pulse{0%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(1.05);opacity:.45}}@keyframes step-a{0%,30%{transform:translateY(0)}15%{transform:translateY(-1px)}}@keyframes step-b{0%,50%,80%{transform:translateY(0)}65%{transform:translateY(-1px)}}@keyframes sway-base{0%,50%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(.8px,0) rotate(1.5deg)}75%{transform:translate(-.8px,0) rotate(-1.5deg)}}@keyframes sway-mid{0%,50%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(.6px,0) rotate(2deg)}75%{transform:translate(-.6px,0) rotate(-2deg)}}@keyframes sway-top{0%,50%{transform:translate(0,0) rotate(0deg)}25%{transform:translate(1px,.2px) rotate(3deg)}75%{transform:translate(-1px,.2px) rotate(-3deg)}}@keyframes arm-l-bal{0%,50%{transform:rotate(30deg)}25%{transform:rotate(40deg)}75%{transform:rotate(20deg)}}@keyframes arm-r-bal{0%,50%{transform:rotate(-30deg)}25%{transform:rotate(-20deg)}75%{transform:rotate(-40deg)}}@keyframes sweat-fly{0%,55%{opacity:0;transform:translate(0,0) scale(0)}60%{opacity:1;transform:translate(0,0) scale(1)}80%{opacity:0;transform:translate(-4px,-5px) scale(.5)}}.walk-bob{animation:walk-bob 1.2s infinite ease-in-out}.breathe{transform-origin:7.5px 13px;animation:breathe 3.2s infinite ease-in-out}.eyes-look{animation:eyes-look 5s infinite ease-in-out}.eyes-blink{transform-origin:7.5px 9px;animation:blink 4s infinite}.shadow{transform-origin:7.5px 15.5px;animation:shadow-pulse 3.2s infinite ease-in-out}.legs-a{animation:step-a 1.2s infinite}.legs-b{animation:step-b 1.2s infinite}.sway-base{transform-origin:7.5px 6px;animation:sway-base 3s infinite ease-in-out}.sway-mid{transform-origin:7px 3px;animation:sway-mid 2.5s infinite ease-in-out}.sway-top{transform-origin:7.5px 0;animation:sway-top 2s infinite ease-in-out}.arm-l{transform-origin:2px 10px;animation:arm-l-bal 3s infinite ease-in-out}.arm-r{transform-origin:13px 10px;animation:arm-r-bal 3s infinite ease-in-out}.sweat{opacity:0;animation:sweat-fly 6s infinite}</style></defs><rect width="9" height="1" x="3" y="15" fill="#000" class="shadow"/><g class="walk-bob"><g class="breathe"><g fill="#DE886D"><g class="legs-a"><rect width="1" height="2" x="3" y="13"/><rect width="1" height="2" x="11" y="13"/></g><g class="legs-b"><rect width="1" height="2" x="5" y="13"/><rect width="1" height="2" x="9" y="13"/></g></g><rect width="11" height="7" x="2" y="6" fill="#DE886D"/><g class="eyes-look"><g fill="#000" class="eyes-blink"><rect width="1" height="2" x="4" y="8"/><rect width="1" height="2" x="10" y="8"/></g></g><g class="sway-base"><rect width="7" height="3" x="4" y="3" fill="#5C9CE6"/><rect width="7" height="1" x="4" y="5" fill="#4A80C4"/><rect width="1" height="2" x="7" y="3.5" fill="#7AB8F5" opacity=".5"/><g class="sway-mid"><rect width="7" height="3" x="3" y="0" fill="#7BC67E"/><rect width="7" height="1" x="3" y="2" fill="#5EA661"/><rect width="1" height="2" x="6" y=".5" fill="#9AD89C" opacity=".5"/><g class="sway-top"><rect width="7" height="3" x="5" y="-3" fill="#F0A050"/><rect width="7" height="1" x="5" y="-1" fill="#D08030"/><rect width="1" height="2" x="8" y="-2.5" fill="#F8C888" opacity=".5"/></g></g></g><g fill="#DE886D" class="arm-l"><rect width="2" height="2" x="0" y="9"/></g><g fill="#DE886D" class="arm-r"><rect width="2" height="2" x="13" y="9"/></g><g><g fill="#64D2FF" class="sweat" transform="translate(0, 6)"><rect width="1" height="1" x="0" y="1"/><rect width=".5" height="1" x=".25" y="0"/></g></g></g></g></svg>