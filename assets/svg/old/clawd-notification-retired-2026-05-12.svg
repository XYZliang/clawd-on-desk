<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes body-jump{0%,62%{transform:translate(0,0) scale(1,1)}10%,3%{transform:translate(-1.5px,-1px) scale(1.03,.97)}15%,25%{transform:translate(0,1.5px) scale(1.05,.96)}20%{transform:translate(0,-10px) scale(.96,1.04)}30%{transform:translate(0,-8px) scale(.97,1.03)}35%{transform:translate(0,1.2px) scale(1.04,.97)}40%{transform:translate(0,-5px) scale(.98,1.02)}45%{transform:translate(0,1px) scale(1.03,.98)}50%{transform:translate(0,-3px) scale(.99,1.01)}55%{transform:translate(0,.5px) scale(1.01,.99)}}@keyframes shadow-pulse{0%,62%{transform:scale(1);opacity:.5}10%,3%{transform:translate(-1.5px,0) scale(1);opacity:.5}15%{transform:scale(1.1);opacity:.55}20%{transform:scale(.5);opacity:.12}25%{transform:scale(1.12);opacity:.55}30%{transform:scale(.55);opacity:.15}35%{transform:scale(1.1);opacity:.52}40%{transform:scale(.65);opacity:.2}45%{transform:scale(1.06);opacity:.5}50%{transform:scale(.75);opacity:.3}55%{transform:scale(1.03);opacity:.5}}@keyframes eye-track{0%,15%{transform:translate(0,0) scaleY(1)}3%{transform:translate(4px,0) scaleY(.3)}10%,6%{transform:translate(4px,0) scaleY(1)}}@keyframes arm-wave-l{0%,62%{transform:rotate(0deg)}10%,3%{transform:rotate(25deg)}15%{transform:rotate(30deg)}20%{transform:rotate(155deg)}25%,40%{transform:rotate(115deg)}30%{transform:rotate(140deg)}35%{transform:rotate(100deg)}45%,50%{transform:rotate(80deg)}55%{transform:rotate(40deg)}}@keyframes arm-wave-r{0%,62%{transform:rotate(0deg)}10%,15%,3%{transform:rotate(-30deg)}20%{transform:rotate(-155deg)}25%,40%{transform:rotate(-115deg)}30%{transform:rotate(-140deg)}35%{transform:rotate(-100deg)}45%,50%{transform:rotate(-80deg)}55%{transform:rotate(-40deg)}}@keyframes alert-flash{0%{opacity:0;transform:scale(.3)}3%{opacity:1;transform:scale(1.3)}10%,50%{opacity:1;transform:scale(1)}55%{opacity:.7;transform:scale(.9)}62%{opacity:0;transform:scale(.6)}}.body-anim{transform-origin:7.5px 15px;animation:body-jump 3.5s infinite ease-in-out}.shadow-anim{transform-origin:7.5px 15.5px;animation:shadow-pulse 3.5s infinite ease-in-out}.eyes-look{transform-origin:7.5px 9px;animation:eye-track 3.5s infinite ease-in-out}.arm-l{transform-origin:1px 10px;animation:arm-wave-l 3.5s infinite ease-in-out}.arm-r{transform-origin:14px 10px;animation:arm-wave-r 3.5s infinite ease-in-out}.alert-pop{transform-origin:16px -1px;animation:alert-flash 3.5s infinite ease-in-out;opacity:0}</style></defs><g transform="translate(15, 0) scale(-1, 1)"><rect width="9" height="1" x="3" y="15" fill="#000" class="shadow-anim"/><g class="body-anim"><g fill="#DE886D"><rect width="1" height="2" x="3" y="13"/><rect width="1" height="2" x="5" y="13"/><rect width="1" height="2" x="9" y="13"/><rect width="1" height="2" x="11" y="13"/><rect width="11" height="7" x="2" y="6"/><g class="arm-l"><rect width="2" height="2" x="0" y="9"/></g><g class="arm-r"><rect width="2" height="2" x="13" y="9"/></g></g><g fill="#000" class="eyes-look"><rect width="1" height="2" x="4" y="8"/><rect width="1" height="2" x="10" y="8"/></g></g></g><g fill="#FF3D00" class="alert-pop"><rect width="2" height="5" x="15" y="-6"/><rect width="2" height="2" x="15" y="0"/></g></svg>