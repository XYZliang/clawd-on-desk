<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes breathe{0%{transform:scale(1,1) translate(0,0)}50%{transform:scale(1.02,.98) translate(0,.5px)}}@keyframes shadow-pulse{0%{transform:scale(1);opacity:.5}50%{transform:scale(1.05);opacity:.4}}@keyframes blink{0%,10%{transform:scaleY(1)}5%{transform:scaleY(.1)}}@keyframes flow-normal{0%,25%,50%,75%{transform:translate(-2px,6px);opacity:0}31.25%,56.25%,6.25%,81.25%{transform:translate(0,1px);opacity:1}12.5%,37.5%,62.5%,87.5%{transform:translate(7.5px,-3px);opacity:1}18.75%,43.75%,68.75%,93.75%{transform:translate(15px,1px);opacity:1}24.5%,49.5%,74.5%,99.5%{transform:translate(17px,6px);opacity:0}}@keyframes cs1{0%,10%,20%{transform:scale(1)}12.5%,18%{transform:scale(2.2)}}@keyframes cs3{0%,43%,53%{transform:scale(1)}45%,51%{transform:scale(2.2)}}@keyframes cs4{0%,65.5%,75.5%{transform:scale(1)}67.5%,73.5%{transform:scale(2.2)}}@keyframes dim-all{0%,22%,41%,55%,63.5%,77.5%,8%{opacity:1}10%,20%,43%,53%,65.5%,75.5%{opacity:.12}}@keyframes dim-23{0%,41%,55%,63.5%,77.5%{opacity:1}43%,53%,65.5%,75.5%{opacity:.12}}@keyframes dim-13{0%,22%,63.5%,77.5%,8%{opacity:1}10%,20%,65.5%,75.5%{opacity:.12}}@keyframes dim-12{0%,22%,41%,55%,8%{opacity:1}10%,20%,43%,53%{opacity:.12}}@keyframes eyes-dispatch{0%,23%,41%,56%,63%,78%,8%{transform:translate(0,0)}10%,20%{transform:translate(-1.5px,0)}43%,53%{transform:translate(0,-1.5px)}65.5%,75.5%{transform:translate(1.5px,0)}}@keyframes arm-l-dispatch{0%,10%,18%{transform:rotate(10deg)}12.5%{transform:rotate(24deg)}}@keyframes arm-r-dispatch{0%,43%,51%,65.5%,73.5%{transform:rotate(-10deg)}45%{transform:rotate(-18deg)}67.5%{transform:rotate(-24deg)}}@keyframes spark-l{0%,10%,21%{opacity:0}12.5%,18%{opacity:1}}@keyframes spark-p{0%,43%,54%{opacity:0}45%,51%{opacity:1}}@keyframes spark-r{0%,65%,76%{opacity:0}67.5%,73.5%{opacity:1}}.breathe{transform-origin:7.5px 13px;animation:breathe 3.2s infinite ease-in-out}.shadow-pulse{transform-origin:7.5px 15.5px;animation:shadow-pulse 3.2s infinite ease-in-out}.eyes-blink{transform-origin:7.5px 9px;animation:blink 4s infinite}.f1,.f2,.f3,.f4,.f5{animation-name:flow-normal;animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:linear}.f1{animation-delay:0s}.f2{animation-delay:-.4s}.f3{animation-delay:-.8s}.f4{animation-delay:-1.2s}.f5{animation-delay:-1.6s}.cs1{animation:cs1 4s infinite}.cs1,.cs3,.cs4{transform-origin:1px 1px}.cs3{animation:cs3 4s infinite}.cs4{animation:cs4 4s infinite}.dim-all{animation:dim-all 4s infinite}.dim-23{animation:dim-23 4s infinite}.dim-13{animation:dim-13 4s infinite}.dim-12{animation:dim-12 4s infinite}.eyes-dispatch{animation:eyes-dispatch 4s infinite}.arm-l-dispatch{transform-origin:2px 10px;animation:arm-l-dispatch 4s infinite}.arm-r-dispatch{transform-origin:13px 10px;animation:arm-r-dispatch 4s infinite}.spark-l{animation:spark-l 4s infinite}.spark-p{animation:spark-p 4s infinite}.spark-r{animation:spark-r 4s infinite}</style></defs><rect width="9" height="1" x="3" y="15" fill="#000" class="shadow-pulse"/><g class="dim-23"><g class="f1"><g class="cs1"><rect width="2" height="2" x="0" y="0" fill="#FF5252"/></g></g></g><g class="dim-all"><g class="f2"><rect width="2" height="2" x="0" y="0" fill="#FFC107"/></g></g><g class="dim-13"><g class="f3"><g class="cs3"><rect width="2" height="2" x="0" y="0" fill="#0082FC"/></g></g></g><g class="dim-12"><g class="f4"><g class="cs4"><rect width="2" height="2" x="0" y="0" fill="#4CAF50"/></g></g></g><g class="dim-all"><g class="f5"><rect width="2" height="2" x="0" y="0" fill="#9C27B0"/></g></g><rect width="1" height="1" x="-1.5" y="-.5" fill="#FFF" class="spark-l" opacity="0"/><rect width="1" height="1" x="9.5" y="-5" fill="#FFF" class="spark-p" opacity="0"/><rect width="1" height="1" x="17" y="-.5" fill="#FFF" class="spark-r" opacity="0"/><g class="breathe"><g fill="#DE886D"><rect width="1" height="2" x="3" y="13"/><rect width="1" height="2" x="5" y="13"/