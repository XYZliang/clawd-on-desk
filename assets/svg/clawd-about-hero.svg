<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="-2 2 20 16"><defs><style>@keyframes breath{0%{transform:translateY(0)}50%{transform:translateY(-.3px)}}@keyframes shake{0%{transform:rotate(0)}20%{transform:rotate(-3deg)}60%{transform:rotate(3deg)}80%{transform:rotate(-2deg)}}@keyframes arm-right{0%,9%{transform:none}15%,33%{transform:translateY(-3px) rotate(-90deg)}45%,73%{transform:translate(-1px,-1px)}82%{transform:translate(.5px,1px)}}@keyframes arm-left{0%,27%{transform:none}45%,73%{transform:translate(1px,-1px)}82%{transform:translate(-.5px,1px)}}@keyframes glasses-fly{0%,15%{transform:translate(10.15px,3.25px) scale(.3);opacity:0}22%,33%{transform:translate(10.15px,3.25px) scale(.3);opacity:1}55%{transform:translate(1.325px,7.375px) scale(.65);opacity:1}}@keyframes mood{0%,55%,73%{transform:rotate(0deg)}60%,82%{transform:rotate(1deg)}65%{transform:rotate(-1deg)}}@keyframes shadow-fade{0%,40%,87%{opacity:0}51%,76%{opacity:1}}@keyframes sparkle-near{0%,73%,80%{opacity:0;transform:scale(.4)}75%{opacity:1;transform:scale(.7)}78%{opacity:.7;transform:scale(.5)}}@keyframes sparkle-far{0%,84%{opacity:0;transform:scale(.5)}87%{opacity:1;transform:scale(1.4)}91%{opacity:.9;transform:scale(1.2)}96%{opacity:0;transform:scale(.6)}}.arm-right-motion{transform-origin:13px 10px;animation:arm-right 4.4s ease-in-out forwards}.arm-left-motion{transform-origin:2px 10px;animation:arm-left 4.4s ease-in-out forwards}.glasses-fly{transform-origin:0 0;animation:glasses-fly 4.4s ease-in-out forwards}.mood{transform-origin:7.5px 13px;animation:mood 4.4s ease-in-out forwards}.shadow-fade{animation:shadow-fade 4.4s ease-in-out forwards}.sparkle-near{transform-origin:2.5px 6.5px;animation:sparkle-near 4.4s ease-in-out forwards}.sparkle-far{transform-origin:3.5px 4.5px;animation:sparkle-far 4.4s ease-in-out forwards}.breath-wrap{animation:breath 4s infinite ease-in-out;animation-delay:4.4s}.shake-slot{transform-origin:7.5px 10px}</style><clipPath id="inside-torso">