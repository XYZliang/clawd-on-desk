<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><style>@keyframes body-orbit{0%{transform:translate(0,-.4px) rotate(0deg)}25%{transform:translate(.6px,0) rotate(3.5deg)}50%{transform:translate(0,.4px) rotate(0deg)}75%{transform:translate(-.6px,0) rotate(-3.5deg)}}@keyframes legs-orbit{0%{transform:translate(0,-.12px)}25%{transform:translate(.2px,0)}50%{transform:translate(0,.12px)}75%{transform:translate(-.2px,0)}}@keyframes shadow-breathe{0%{transform:scaleX(1);opacity:.48}25%,75%{transform:scaleX(.96);opacity:.42}50%{transform:scaleX(1.04);opacity:.52}}@keyframes arm-wobble{0%,50%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(.4px) rotate(-8deg)}75%{transform:translateY(-.4px) rotate(8deg)}}@keyframes star-orbit{0%{transform:translate(7.5px,.5px) scale(1);opacity:1}25%{transform:translate(11.5px,2px) scale(1);opacity:1}50%{transform:translate(7.5px,3.5px) scale(.75);opacity:.6}75%{transform:translate(3.5px,2px) scale(1);opacity:1}}@keyframes blue-flick-1{0%{transform:translate(3.6px,5px);opacity:0}30%{transform:translate(4px,4.75px);opacity:.95}60%{transform:translate(4.4px,5px);opacity:.95}90%{transform:translate(4px,5.25px);opacity:0}}@keyframes blue-flick-2{0%{transform:translate(10.6px,5px);opacity:0}30%{transform:translate(11px,4.75px);opacity:.95}60%{transform:translate(11.4px,5px);opacity:.95}90%{transform:translate(11px,5.25px);opacity:0}}@keyframes blue-flick-3{0%{transform:translate(7.1px,4px);opacity:0}30%{transform:translate(7.5px,3.75px);opacity:.9}60%{transform:translate(7.9px,4px);opacity:.9}90%{transform:translate(7.5px,4.25px);opacity:0}}#legs-only,#upper-body{transform-box:view-box}#upper-body{transform-origin:7.5px 13px;animation:body-orbit 3s linear infinite}#legs-only{transform-origin:7.5px 15px;animation:legs-orbit 3s linear infinite}#ground-shadow,#left-arm,#right-arm{transform-box:view-box;transform-origin:7.5px 15.5px;animation:shadow-breathe 3s linear infinite}#left-arm,#right-arm{transform-origin:2px 10px;animation:arm-wobble 3s linear infinite}#right-arm{transform-origin:13px 10px;animation-delay:-1.5s}.eye-path{stroke-dasharray:.85 .4;animation:eye-flow .8s linear infinite}.right-eye-wrap .eye-path{animation-direction:reverse}.left-eye-wrap{transform-box:view-box;transform-origin:4.5px 9px}.left-eye-wrap,.right-eye-wrap{animation:micro-spin-cw 6s linear infinite}.right-eye-wrap,.star{transform-box:view-box}.right-eye-wrap{transform-origin:10.5px 9px}.star{transform-origin:center;animation:star-orbit 6s linear infinite}.star-1{animation-delay:0s}.star-2{animation-delay:-2s}.star-3{animation-delay:-4s}.blue-dot{transform-box:view-box;transform-origin:center}.blue-1{animation:blue-flick-1 1.4s linear infinite}.blue-2{animation:blue-flick-2 1.7s linear infinite;animation-delay:-.6s}.blue-3{animation:blue-flick-3 1.9s linear infinite;animation-delay:-1s}</style><rect id="ground-shadow" width="9" height="1" x="3" y="15" fill="#000" opacity=".48"/><g id="legs-only" fill="#DE886D"><rect width="1" height="2" x="3" y="13"/><rect width="1" height="2" x="5" y="13"/><rect width="1" height="2" x="9" y="13"/><rect width="1" height="2" x="11" y="13"/></g><g id="upper-body"><g fill="#DE886D"><rect id="torso" width="11" height="7" x="2" y="6"/><g id="left-arm"><rect width="2" height="2" x="0" y="9"/></g><g id="right-arm"><rect width="2" height="2" x="13" y="9"/></g></g><g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width=".52" shape-rendering="geometricPrecision"><g class="left-eye-wrap"><path d="M 4.969,9.260 L 4.946,9.299 L 4.917,9.336 L 4.883,9.370 L 4.842,9.400 L 4.797,9.426 L 4.746,9.446 L 4.692,9.460 L 4.634,9.467 L 4.573,9.466 L 4.512,9.458 L 4.450,9.441 L 4.388,9.416 L 4.329,9.383 L 4.272,9.341 L 4.220,9.291 L 4.173,9.233 L 4.133,9.168 L 4.100,9.097 L 4.075,9.021 L 4.060,8.940 L 4.055,8.855 L 4.060,8.769 L 4.076,8.682 L 4.103,8.596 L 4.141,8.511 L 4.190,8.431 L 4.251,8.355 L 4.321,8.286 L 4.400,8.224 L 4.489,8.171 