<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 46"><defs><style>@keyframes bd-swig{0%,28%,34%,56%,70%,8%{transform:rotate(0deg) translate(0,0)}14%,22%{transform:rotate(-70deg) translate(-1px,-2px)}40%,50%{transform:rotate(-75deg) translate(-1px,-2.5px)}78%{transform:rotate(100deg) translate(2px,3px)}}@keyframes bd-sway{0%,30%,72%{transform:rotate(0deg)}38%{transform:rotate(-2.5deg)}46%{transform:rotate(2.5deg)}54%{transform:rotate(-4deg)}62%{transform:rotate(4deg)}68%{transform:rotate(-5deg)}}@keyframes bd-topple{0%,72%{transform:rotate(0deg)}76%{transform:rotate(20deg)}80%{transform:rotate(88deg)}}@keyframes bd-droop{0%,35%{transform:scaleY(1)}55%{transform:scaleY(.55)}75%{transform:scaleY(.12)}}@keyframes bd-shadow{0%,72%{transform:scaleX(1);opacity:.5}80%{transform:scaleX(1.5);opacity:.4}}@keyframes bd-ember{0%{opacity:.85}50%{opacity:1}}@keyframes bd-ember-hot{0%{opacity:0}50%{opacity:1}}@keyframes bd-rise{0%{transform:translate(0,1.5px);opacity:0}25%{opacity:.8}}@keyframes bd-float{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1}}.bd-master{transform-origin:12px 15px;animation:bd-topple 15s 1 ease-in-out forwards}.bd-sway{transform-origin:7.5px 13px;animation:bd-sway 15s 1 ease-in-out forwards}.bd-eyes{transform-origin:7.5px 9px;animation:bd-droop 15s 1 ease-in-out forwards}.bd-bottle{transform-origin:15.5px 12px;animation:bd-swig 15s 1 ease-in-out forwards}.bd-shadow{transform-origin:7.5px 15.5px;animation:bd-shadow 15s 1 ease-in-out forwards}.bd-ember{animation:bd-ember 1.6s infinite ease-in-out}.bd-ember-hot{animation:bd-ember-hot 1.6s infinite ease-in-out}.bd-smoke{opacity:0}.bd-s1,.bd-s2{animation:bd-rise 3s infinite linear}.bd-s2{animation-delay:1.5s}.bd-z{opacity:0}.bd-z1{animation-delay:11.5s}.bd-z1,.bd-z2,.bd-z3{animation:bd-float 3.5s infinite ease-in-out}.bd-z2{animation-delay:12.7s}.bd-z3{animation-delay:13.9s}</style></defs><g class="bd-shadow"><rect width="9" height="1" x="3" y="15" fill="#000" opacity=".5"/></g><g class="bd-master"><g fill="#DE886D"><rect width="1" height="2" x="3" y="13"/><rect width="1" height="2" x="5" y="13"/><rect width="1" height="2" x="9" y="13"/><rect width="1" height="2" x="11" y="13"/></g><g class="bd-sway"><rect width="11" height="7" x="2" y="6" fill="#DE886D"/><rect width="2" height="2" x="0" y="9" fill="#DE886D"/><rect width="2" height="2" x="13" y="9" fill="#DE886D"/><g class="od-hat"><rect width="1" height="1" x="-1" y="4" fill="#A5682A"/><rect width="1" height="1" x="15" y="4" fill="#A5682A"/><rect width="15" height="1" x="0" y="5" fill="#A5682A"/><rect width="9" height="3" x="3" y="2" fill="#A5682A"/><rect width="3" height="1" x="3" y="1" fill="#A5682A"/><rect width="3" height="1" x="9" y="1" fill="#A5682A"/><rect width="9" height="1" x="3" y="4" fill="#6B3E1D"/></g><g fill="#000" class="bd-eyes"><rect width="1" height="2" x="4" y="8"/><rect width="1" height="2" x="10" y="8"/></g><g class="od-cig"><rect width="3" height="1" x="12" y="11" fill="#EDEDE3"/><g class="bd-ember"><rect width="1" height="1" x="15" y="11" fill="#E03A00"/><rect width="1" height="1" x="15" y="11" fill="#FF7A1A" class="bd-ember-hot"/></g><rect width=".8" height=".8" x="14" y="9.4" fill="#9E9E9E" class="bd-smoke bd-s1"/><rect width=".7" height=".7" x="14.2" y="7.4" fill="#B0B0B0" class="bd-smoke bd-s2"/></g><g class="bd-bottle"><rect width="2" height="4" x="15" y="8" fill="#B06A28"/><rect width="1" height="1.5" x="15.5" y="6.5" fill="#B06A28"/><rect width="1" height="1" x="15.5" y="8.4" fill="#E8C87A"/></g></g></g><g fill="#9AB8D8"><rect width="1.6" height="1.6" x="14" y="10" class="bd-z bd-z1"/><rect width="1.2" height="1.2" x="15" y="9" class="bd-z bd-z2"/><rect width=".9" height=".9" x="13" y="9" class="bd-z bd-z3"/></g></svg>