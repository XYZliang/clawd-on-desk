<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes body-react{0%,85%{transform:translate(0,0) scale(1,1)}4%{transform:translate(0,1.5px) scale(1,1)}6%{transform:translate(0,1px) scale(1,1)}14%,35%{transform:translate(2px,0) scale(1,1)}40%{transform:translate(1.5px,-.5px) scale(1,1.01)}46%{transform:translate(1px,1px) scale(1.03,.97)}52%{transform:translate(.5px,.5px) scale(1.01,.99)}68%{transform:translate(.3px,.3px) scale(1,1)}}@keyframes arm-l-react{0%,48%,6%{transform:rotate(0deg)}14%{transform:rotate(-50deg)}35%{transform:rotate(-45deg)}43%{transform:rotate(-15deg)}}@keyframes eyes-react{0%,78%{transform:scaleY(1)}3%{transform:scaleY(.2)}46%,6%,68%{transform:scaleY(.6)}14%,35%{transform:scaleY(.5)}40%,74%{transform:scaleY(.1)}}@keyframes qmark-pop{0%,4%{opacity:0;transform:translate(0,4px) scale(.5)}10%{opacity:1;transform:translate(0,0) scale(1.1)}14%,26%{opacity:1;transform:translate(0,0) scale(1)}34%{opacity:0;transform:translate(0,-3px) scale(1.1)}}@keyframes sigh-puff{0%,37%{opacity:0;transform:translate(0,1px) scale(.3)}43%{opacity:.6;transform:translate(0,0) scale(.8)}48%{opacity:.7;transform:translate(1px,0) scale(1)}60%{opacity:0;transform:translate(4px,-4px) scale(1.3)}}@keyframes shadow-react{0%,85%{transform:translate(0,0) scaleX(1);opacity:.5}4%{transform:translate(0,0) scaleX(.93);opacity:.45}14%,35%{transform:translate(1px,0) scaleX(1);opacity:.5}46%{transform:translate(.5px,0) scaleX(1.05);opacity:.55}68%{transform:translate(.3px,0) scaleX(1.02);opacity:.52}}.body-react{transform-origin:7.5px 12px;animation:body-react 6s 1 ease-in-out forwards}.arm-l-react{transform-origin:2px 10px;animation:arm-l-react 6s 1 ease-in-out forwards}.eyes-react{transform-origin:7.5px 9px;animation:eyes-react 6s 1 ease-in-out forwards}.shadow-react{transform-origin:7.5px 15.5px;animation:shadow-react 6s 1 ease-in-out forwards}.qmark{opacity:0;transform-origin:8px -2px;animation:qmark-pop 6s 1 ease-out forwa