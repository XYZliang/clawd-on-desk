<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes body-jump{0%,35%{transform:translateY(0)}10%{transform:translateY(-5px)}15%{transform:translateY(-4.5px)}23%{transform:translateY(1px)}29%{transform:translateY(-.5px)}}@keyframes legs-jump{0%,35%{transform:translateY(0)}10%{transform:translateY(-2px)}15%{transform:translateY(-1.5px)}23%{transform:translateY(.5px)}29%{transform:translateY(-.3px)}}@keyframes body-squash{0%,35%,55%{transform:scale(1,1)}10%{transform:scale(.88,.88)}15%{transform:scale(.9,.9)}23%{transform:scale(1.1,.9)}29%{transform:scale(.97,1.03)}45%{transform:scale(1.03,.97)}}@keyframes arm-l-react{0%,30%{transform:translate(0,0) rotate(0deg)}10%{transform:translate(-2px,-2px) rotate(70deg)}15%{transform:translate(-1.5px,-1.5px) rotate(55deg)}}@keyframes arm-r-react{0%,32%{transform:translate(0,0) rotate(0deg)}10%{transform:translate(2px,-2px) rotate(-70deg)}15%{transform:translate(1.5px,-1.5px) rotate(-55deg)}40%,50%{transform:rotate(-50deg)}56%{transform:rotate(-42deg)}62%{transform:rotate(-48deg)}78%{transform:rotate(-15deg)}90%{transform:rotate(0deg)}}@keyframes eyes-gaze{0%,35%,70%{transform:translate(0,0)}42%,63%{transform:translate(0,.5px)}}@keyframes eyes-blink{0%,30%,88%{transform:scaleY(1)}8%{transform:scaleY(1.3)}15%{transform:scaleY(1.2)}23%,36%,50%,82%{transform:scaleY(.1)}}@keyframes rect-vis{0%,82%{visibility:visible}38%{visibility:hidden}}@keyframes xmark-vis{0%,82%{visibility:hidden}38%{visibility:visible}}@keyframes shadow-react{0%,35%{transform:scaleX(1);opacity:.5}10%{transform:scaleX(.55);opacity:.2}15%{transform:scaleX(.6);opacity:.23}23%{transform:scaleX(1.12);opacity:.55}29%{transform:scaleX(.95);opacity:.48}}@keyframes excl-pop{0%,4%{opacity:0;transform:translate(0,10px) scale(.3)}10%{opacity:1;transform:translate(0,0) scale(1.3)}15%,30%{opacity:1;transform:translate(0,0) scale(1)}42%{opacity:0;transform:translate(0,-2px) scale(.8)}}.body-jump{animation:body-jump 3.5s 1 ease-in-out forwards}.legs-jump{animation:legs-jump 3.5s 1 ease-in-out forwards}.body-react{transform-origin:7.5px 13px;animation:body-squash 3.5s 1 ease-in-out forwards}.arm-l-react{transform-origin:2px 10px;animation:arm-l-react 3.5s 1 ease-in-out forwards}.arm-r-react{transform-origin:13px 10px;animation:arm-r-react 3.5s 1 ease-in-out forwards}.eyes-gaze{animation:eyes-gaze 3.5s 1 ease-in-out forwards}.eyes-rect{transform-origin:7.5px 9px;animation:eyes-blink 3.5s 1 ease-in-out forwards,rect-vis 3.5s 1 step-end forwards}.eyes-xmark{visibility:hidden;animation:xmark-vis 3.5s 1 step-end forwards}.shadow-react{transform-origin:7.5px 15.5px;animation:shadow-react 3.5s 1 ease-in-out forwards}.excl-pop{animation:excl-pop 3.5s 1 ease-in-out forwards;opacity:0}</style></defs><rect width="9" height="1" x="3" y="15" fill="#000" class="shadow-react" opacity=".5"/><g fill="#DE886D" class="legs-jump"><rect width="1" height="2" x="3" y="13"/><rect width="1" height="2" x="5" y="13"/><rect width="1" height="2" x="9" y="13"/><rect width="1" height="2" x="11" y="13"/></g><g class="body-jump"><g class="body-react"><g fill="#DE886D"><rect width="11" height="7" x="2" y="6"/></g><g fill="#DE886D"><g class="arm-l-react"><rect width="2" height="2" x="0" y="9"/></g><g class="arm-r-react"><rect width="2" height="2" x="13" y="9"/></g></g><g class="eyes-gaze"><g fill="#000" class="eyes-rect"><rect width="1" height="2" x="4" y="8"/><rect width="1" height="2" x="10" y="8"/></g><g fill="#000" class="eyes-xmark"><rect width="1" height="1" x="4" y="9"/><rect width="1" height="1" x="10" y="9"/></g></g></g><g fill="#FF3D00" class="excl-pop"><rect width="1.5" height="3" x="7" y="-5"/><rect width="1.5" height="1.5" x="7" y="-1"/></g></g></svg>