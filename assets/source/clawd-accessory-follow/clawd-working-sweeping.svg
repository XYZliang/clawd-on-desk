<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes breathe{0%{transform:scale(1,1) translate(0,0)}50%{transform:scale(1.02,.98) translate(0,.5px)}}@keyframes blink{0%,10%{transform:scaleY(1)}5%{transform:scaleY(.1)}}@keyframes body-lean{0%,1%{transform:translate(0,0) rotate(0deg)}38%,5%,62%,85%{transform:translate(1px,0) rotate(6deg)}43%,57%{transform:translate(0,0) rotate(2deg)}90%{transform:translate(.5px,0) rotate(3deg)}}@keyframes shadow-anim{0%,1%,43%,57%{transform:scaleX(1);opacity:.5}38%,5%,62%,85%{transform:scaleX(1.08);opacity:.55}90%{transform:scaleX(1.03);opacity:.52}}@keyframes arm-right{0%,1%,36%,57%{transform:rotate(0deg)}15%,23%,4%,61%,69%,7%,77%{transform:rotate(35deg)}10%,18%,26%,64%,72%,80%{transform:rotate(-15deg)}30%,85%{transform:rotate(10deg)}90%{transform:rotate(5deg)}}@keyframes arm-left{0%,41%,55%{transform:translate(0,0) rotate(0deg)}44%,48%,52%{transform:translate(2px,-4px) rotate(35deg)}46%,50%{transform:translate(2.5px,-5px) rotate(50deg)}}@keyframes eye-dir{0%,2%,43%,57%{transform:translate(0,0)}38%,5%,62%,85%{transform:translate(1px,1px)}90%{transform:translate(.5px,.5px)}}@keyframes dust1{0%,8%{opacity:0;transform:translate(17px,15px) scale(0)}10%,64%{opacity:.6;transform:translate(17px,15px) scale(1)}16%,70%{opacity:0;transform:translate(20px,13.5px) scale(.3)}17%,62%,71%{opacity:0}}@keyframes dust2{0%,16%{opacity:0;transform:translate(16px,16px) scale(0)}18%,72%{opacity:.5;transform:translate(16px,16px) scale(1)}24%,78%{opacity:0;transform:translate(19px,14.5px) scale(.3)}25%,70%,79%{opacity:0}}@keyframes dust3{0%,24%{opacity:0;transform:translate(18px,15.5px) scale(0)}26%,80%{opacity:.5;transform:translate(18px,15.5px) scale(1)}32%,86%{opacity:0;transform:translate(21px,14px) scale(.3)}33%,78%,87%{opacity:0}}@keyframes sweat1{0%,8%{opacity:0;transform:translate(0,0) scale(0)}10%{opacity:1;transform:translate(0,0) scale(1)}20%{opacity:0;transform:translate(-5px,-5px) scale(.5)}21%{opacity:0}}@keyframes sweat2{0%,16%{opacity:0;transform:translate(0,0) scale(0)}18%{opacity:1;transform:translate(0,0) scale(1)}28%{opacity:0;transform:translate(-4px,-6px) scale(.4)}29%{opacity:0}}.breathe{transform-origin:7.5px 13px;animation:breathe 3.2s infinite ease-in-out}.blink{transform-origin:7.5px 9px;animation:blink 4s infinite}.body-lean{transform-origin:7.5px 15px;animation:body-lean 10s infinite ease-in-out}.shadow-anim{transform-origin:7.5px 15.5px;animation:shadow-anim 10s infinite ease-in-out}.arm-r{transform-origin:14px 10px;animation:arm-right 10s infinite ease-in-out}.arm-l{transform-origin:1px 10px;animation:arm-left 10s infinite ease-in-out}.eyes-dir{animation:eye-dir 10s infinite ease-in-out}.dust{opacity:0}.dust-1{animation:dust1 10s infinite}.dust-2{animation:dust2 10s infinite}.dust-3{animation:dust3 10s infinite}.sweat{opacity:0}.sweat-1{animation:sweat1 10s infinite}.sweat-2{animation:sweat2 10s infinite}</style></defs><g transform="translate(15, 0) scale(-1, 1)"><rect width="9" height="1" x="3" y="15" fill="#000" class="shadow-anim" opacity=".5"/><rect width="1.5" height="1.5" x="0" y="0" fill="#9E9E9E" class="dust dust-1"/><rect width="1" height="1" x="0" y="0" fill="#B0BEC5" class="dust dust-2"/><rect width="1.2" height="1.2" x="0" y="0" fill="#9E9E9E" class="dust dust-3"/><g fill="#DE886D"><rect width="1" height="2" x="3" y="13"/><rect width="1" height="2" x="5" y="13"/><rect width="1" height="2" x="9" y="13"/><rect width="1" height="2" x="11" y="13"/></g><g class="body-lean"><g><g fill="#40C4FF" class="sweat sweat-1" transform="translate(1, 5)"><rect width="1.5" height="1.5" x="0" y="1"/><rect width="1" height="1" x=".25" y="0"/></g></g><g><g fill="#40C4FF" class="sweat sweat-2" transform="translate(-0.5, 7)"><rect width="1" height="1" x="0" y=".5"/><rect width=".7" height=".7" x=".15" y="0"/></g></g><g class="breathe"><rect width="11" height="7" x="2" y="6" fill="#DE886D"/><g class="arm-l"><rect width="2" height="2" x="0" 