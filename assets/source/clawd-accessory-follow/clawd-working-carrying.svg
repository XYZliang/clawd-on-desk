<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes walk-bounce{0%,50%{transform:translateY(1px)}25%,75%{transform:translateY(0)}}@keyframes step{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}@keyframes pack-swing{0%{transform:rotate(3deg)}}@keyframes arm-swing{0%{transform:rotate(-8deg)}}@keyframes cap-sway{0%{transform:rotate(-3deg)}}@keyframes shadow-walk{0%,50%{transform:scale(1.03);opacity:.55}25%,75%{transform:scale(1);opacity:.5}}@keyframes eyes-gaze{0%,15%,88%{transform:translate(-1px,0)}25%,80%{transform:translate(0,0)}}@keyframes eyes-blink-rush{0%,31%,4%,76%,8%,83%{transform:scaleY(1)}28%,6%,78%{transform:scaleY(.1)}}@keyframes rect-vis{0%,79%{visibility:visible}29%{visibility:hidden}}@keyframes xmark-vis{0%,79%{visibility:hidden}29%{visibility:visible}}@keyframes sweat1-fly{0%,27%{transform:translate(0,0);opacity:0}31%{transform:translate(0,0);opacity:1}55%{transform:translate(4px,-3px);opacity:0}}@keyframes sweat2-fly{0%,37%{transform:translate(0,0);opacity:0}41%{transform:translate(0,0);opacity:1}65%{transform:translate(2px,-5px);opacity:0}}.body-walk{transform-origin:7.5px 15px;animation:walk-bounce .4s infinite ease-in-out}.step-a,.step-b{animation:step .4s infinite ease-in-out}.step-b{animation-delay:-.2s}.pack-swing{transform-origin:13px 8px;animation:pack-swing .4s infinite alternate ease-in-out}.arm-swing-l{transform-origin:2px 9px;animation:arm-swing .4s infinite alternate ease-in-out}.cap-sway{transform-origin:6px 6.5px;animation:cap-sway .8s infinite alternate ease-in-out}.shadow-walk{transform-origin:7.5px 15.5px;animation:shadow-walk .4s infinite ease-in-out}.eyes-gaze{animation:eyes-gaze 2.5s infinite}.eyes-rect{transform-origin:7.5px 9px;animation:eyes-blink-rush 2.5s infinite,rect-vis 2.5s infinite step-end}.eyes-xmark{visibility:hidden;animation:xmark-vis 2.5s infinite step-end}.sweat-1{animation:sweat1-fly 2.5s infinite}.sweat-2{animation:sweat2-fly 2.5s infinite}</style></defs><rect width="9" height="1" x="3" y="15" fill="#000" class="shadow-walk" opacity=".5"/><g><g class="body-walk" transform="rotate(-2, 7.5, 15)"><g class="pack-swing"><rect width="4" height="6" x="13" y="7" fill="#5C9CE6"/><rect width="5" height="4" x="12" y="8" fill="#5C9CE6"/><rect width="4" height="2" x="13" y="7" fill="#3D7AC7"/><rect width="4" height="1" x="13" y="10" fill="#3D7AC7"/><rect width="4" height="1" x="13" y="12" fill="#2D5FA5"/><rect width="1" height="1" x="15" y="9" fill="#FFD54F"/></g><g fill="#DE886D"><rect width="1" height="2" x="3" y="13" class="step-a"/><rect width="1" height="2" x="5" y="13" class="step-b"/><rect width="1" height="2" x="9" y="13" class="step-b"/><rect width="1" height="2" x="11" y="13" class="step-a"/></g><rect width="11" height="7" x="2" y="6" fill="#DE886D"/><g fill="#DE886D" class="arm-swing-l"><rect width="3" height="2" x="0" y="9"/></g><rect width="2" height="2" x="13" y="9" fill="#DE886D"/><rect width="1" height="4" x="13" y="7" fill="#3D7AC7"/><g class="eyes-gaze"><g fill="#000" class="eyes-rect"><rect width="1" height="2" x="4" y="8"/><rect width="1" height="2" x="10" y="8"/></g><g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width=".7" class="eyes-xmark"><polyline points="4 8 5.5 9 4 10"/><polyline points="11 8 9.5 9 11 10"/></g></g><g fill="#40C4FF" class="sweat-1"><rect width="1" height="1.5" x="14" y="5"/><rect width=".5" height=".5" x="14.25" y="4.5"/></g><g fill="#40C4FF" class="sweat-2"><rect width="1" height="1.5" x="16" y="4"/><rect width=".5" height=".5" x="16.25" y="3.5"/></g><g class="cap-sway"><g transform="rotate(-15, 6, 6.5)"><rect width="7" height="2" x="1" y="4.5" fill="#5C9CE6"/><rect width="4" height="1" x="-1" y="5.5" fill="#3D7AC7"/><rect width="1" height="1" x="4" y="4.5" fill="#FFD54F"/></g></g></g></g></svg>