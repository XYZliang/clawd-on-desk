<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes breathe{0%{transform:scale(1,1) translate(0,0)}50%{transform:scale(1.02,.98) translate(0,.5px)}}@keyframes blink{0%,10%{transform:scaleY(1)}5%{transform:scaleY(.1)}}@keyframes rock{0%,50%{transform:rotate(0deg) translateY(0)}25%{transform:rotate(-3deg) translateY(.3px)}75%{transform:rotate(3deg) translateY(.3px)}}@keyframes shadow-rock{0%,50%{transform:scaleX(1);opacity:.5}25%{transform:scaleX(1.03) translateX(-.3px);opacity:.52}75%{transform:scaleX(1.03) translateX(.3px);opacity:.52}}@keyframes arm-jl{0%,50%{transform:rotate(20deg)}25%{transform:rotate(35deg)}75%{transform:rotate(5deg)}}@keyframes arm-jr{0%,50%{transform:rotate(-20deg)}25%{transform:rotate(-5deg)}75%{transform:rotate(-35deg)}}@keyframes eye-track{0%,80%{transform:translate(-1px,-1px)}15%,65%{transform:translate(0,-1.5px)}30%,50%{transform:translate(1px,-1px)}45%{transform:translate(1px,.5px)}90%{transform:translate(-1px,.5px)}}@keyframes juggle{0%{transform:translate(2px,10px)}8%,92%{transform:translate(4px,4px)}18%{transform:translate(6px,0)}30%,80%{transform:translate(8px,-1px)}42%,68%{transform:translate(10px,0)}50%{transform:translate(14px,10px)}58%{transform:translate(12px,4px)}}.breathe{transform-origin:7.5px 13px;animation:breathe 3.2s infinite ease-in-out}.blink{transform-origin:7.5px 9px;animation:blink 4s infinite}.body-rock{transform-origin:7.5px 15px;animation:rock 1.2s infinite ease-in-out}.shadow-anim{transform-origin:7.5px 15.5px;animation:shadow-rock 1.2s infinite ease-in-out}.arm-juggle-l{transform-origin:1px 10px;animation:arm-jl 1.2s infinite ease-in-out}.arm-juggle-r{transform-origin:14px 10px;animation:arm-jr 1.2s infinite ease-in-out}.eye-track{animation:eye-track 2.4s infinite ease-in-out}.packet{animation:juggle 1.2s infinite}.p1{animation-delay:0s;fill:#ff5252}.p2{animation-delay:-.4s;fill:#ffc107}.p3{animation-delay:-.8s;fill:#4caf50}</style></defs><rect width="9" height="1" x="3" y="15" fill="#000" class="shadow-anim" opacity=".5"/><g><g class="packet p1"><circle cx="0" cy="0" r="1.2" fill="#FF5252"/><circle cx="-.35" cy="-.35" r=".45" fill="#FF8A80" opacity=".7"/><circle cx=".3" cy=".4" r=".6" fill="#D32F2F" opacity=".3"/></g><g class="packet p2"><circle cx="0" cy="0" r="1.2" fill="#FFC107"/><circle cx="-.35" cy="-.35" r=".45" fill="#FFE082" opacity=".7"/><circle cx=".3" cy=".4" r=".6" fill="#FFA000" opacity=".3"/></g><g class="packet p3"><circle cx="0" cy="0" r="1.2" fill="#4CAF50"/><circle cx="-.35" cy="-.35" r=".45" fill="#81C784" opacity=".7"/><circle cx=".3" cy=".4" r=".6" fill="#388E3C" opacity=".3"/></g></g><g fill="#DE886D"><rect width="1" height="2" x="3" y="13"/><rect width="1" height="2" x="5" y="13"/><rect width="1" height="2" x="9" y="13"/><rect width="1" height="2" x="11" y="13"/></g><g class="body-rock"><g class="breathe"><rect width="11" height="7" x="2" y="6" fill="#DE886D"/><g class="arm-juggle-l"><rect width="2" height="2" x="0" y="9" fill="#DE886D"/></g><g class="arm-juggle-r"><rect width="2" height="2" x="13" y="9" fill="#DE886D"/></g><g fill="#000" class="eye-track"><g class="blink"><rect width="1" height="2" x="4" y="8"/><rect width="1" height="2" x="10" y="8"/></g></g></g></g></svg>