<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" shape-rendering="crispEdges" viewBox="-15 -25 45 45"><defs><style>@keyframes breathe{0%{transform:scale(1,1) translate(0,0)}50%{transform:scale(1.02,.98) translate(0,.5px)}}@keyframes blink{0%,6%{transform:scaleY(1)}3%{transform:scaleY(.1)}}@keyframes shadow-breathe{0%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(1.03);opacity:.47}}@keyframes body-nod{0%,36%,44%,54%,62%{transform:translateY(0)}40%,58%{transform:translateY(.4px)}}@keyframes arm-l-anim{0%,10%,92%{transform:translate(0,0) rotate(0deg)}2.5%{transform:translate(-.5px,0) rotate(25deg)}5%{transform:translate(.3px,0) rotate(-20deg)}7.5%{transform:translate(-.5px,0) rotate(22deg)}18%{transform:translate(-1px,-1px) rotate(15deg)}26%,76%{transform:translate(2px,0) rotate(-5deg)}84%{transform:translate(1px,2px) rotate(0deg)}}@keyframes arm-r-anim{0%,22%,84%{transform:translate(0,0)}28%,76%{transform:translate(-1px,0)}}@keyframes book-anim{0%,12%{opacity:0;transform:translate(-5px,-2px) scaleX(.5)}18%{opacity:1;transform:translate(-5px,-2px) scaleX(.5)}26%,76%{opacity:1;transform:translate(0,0) scaleX(1)}84%{opacity:0;transform:translate(0,4px) scaleX(.8)}}@keyframes eyes-read{0%,22%,80%{transform:translate(0,0)}30%,70%{transform:translate(0,.5px)}46%{transform:translate(-.3px,.5px)}60%{transform:translate(.3px,.5px)}}@keyframes glasses-anim{0%,12%,92%{opacity:0;transform:translateY(-.5px)}18%,30%,84%{opacity:1;transform:translateY(0)}72%{opacity:1;transform:translateY(.3px)}78%{opacity:1;transform:translateY(-.1px)}}@keyframes shadow-l-fade{0%,20%,84%{opacity:0}26%,78%{opacity:1}}@keyframes shadow-r-fade{0%,24%,84%{opacity:0}30%,78%{opacity:1}}@keyframes reading-fx-vis{0%,27%,78%{opacity:0}32%,75%{opacity:1}}@keyframes float-thought{0%{transform:translateY(0);opacity:0}10%{opacity:.6}}.breathe{transform-origin:7.5px 13px;animation:breathe 3.2s infinite ease-in-out}.blink{transform-origin:7.5px 9px;animation:blink 5s infinite}.shadow{transfo