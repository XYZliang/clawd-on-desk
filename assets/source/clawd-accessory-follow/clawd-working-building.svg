<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" shape-rendering="crispEdges" viewBox="-15 -25 45 45"><defs><style>@keyframes breathe{0%{transform:scale(1,1) translate(0,0)}50%{transform:scale(1.02,.98) translate(0,.5px)}}@keyframes blink{0%,10%{transform:scaleY(1)}5%{transform:scaleY(.1)}}@keyframes body-bounce{0%,45%,70%{transform:translateY(0)}30%{transform:translateY(-2px)}50%{transform:translateY(2px)}}@keyframes body-squash{0%,45%,70%{transform:scale(1,1)}30%{transform:scale(.95,1.05)}50%{transform:scale(1.15,.85)}}@keyframes shadow-bounce{0%,45%,70%{transform:scaleX(1);opacity:.5}30%{transform:scaleX(.92);opacity:.42}50%{transform:scaleX(1.08);opacity:.58}}@keyframes hammer-swing{0%,70%{transform:rotate(15deg)}30%{transform:rotate(-45deg)}45%{transform:rotate(40deg)}50%{transform:rotate(125deg)}}@keyframes arm-l-rest{0%{transform:rotate(0deg)}30%{transform:rotate(15deg)}50%{transform:rotate(-5deg)}}@keyframes metal-glow{0%,49%{fill:#ff5252}50%,60%{fill:#fff59d}}@keyframes eyes-look{0%,20%,40%,80%{transform:translate(1.5px,.5px)}25%,35%{transform:translate(1px,-.5px)}70%{transform:translate(.3px,0)}}@keyframes spark-1{0%,49%,71%{opacity:0;transform:translate(0,0) scale(0)}50%{opacity:1;transform:translate(0,0) scale(1)}70%{opacity:0;transform:translate(4px,-6px) scale(0)}}@keyframes spark-2{0%,49%,71%{opacity:0;transform:translate(0,0) scale(0)}50%{opacity:1;transform:translate(0,0) scale(1)}70%{opacity:0;transform:translate(7px,-1px) scale(0)}}@keyframes spark-3{0%,49%,71%{opacity:0;transform:translate(0,0) scale(0)}50%{opacity:1;transform:translate(0,0) scale(1)}70%{opacity:0;transform:translate(3px,3px) scale(0)}}@keyframes sweat-fly{0%,55%{opacity:0;transform:translate(0,0) scale(0)}60%{opacity:1;transform:translate(0,0) scale(1)}80%{opacity:0;transform:translate(-6px,-6px) scale(.5)}}.breathe{transform-origin:7.5px 13px;animation:breathe 3.2s infinite ease-in-out}.blink{transform-origin:7.5px 9px;animation:blink 4s infinite}.body-bounce,.body-squash{transform-origin:7.5px 15px;animation:body-bounce 1.2s infinite}.body-squash{animation:body-squash 1.2s infinite}.arm-hammer{transform-origin:14px 10px;animation:hammer-swing 1.2s infinite}.arm-l-rest{transform-origin:2px 10px;animation:arm-l-rest 1.2s infinite}.shadow-anim{transform-origin:7.5px 15.5px;animation:shadow-bounce 1.2s infinite}.hot-metal{animation:metal-glow 1.2s infinite}.spark{opacity:0}.s1{animation:spark-1 1.2s infinite}.s2{animation:spark-2 1.2s infinite}.s3{animation:spark-3 1.2s infinite}.eyes-look{animation:eyes-look 5s infinite ease-in-out}.sweat{opacity:0;animation:sweat-fly 6s infinite}</style><g id="pixel-spark"><rect width="1" height="1" x="0" y="0"/></g></defs><rect width="9" height="1" x="3" y="15" fill="#000" class="shadow-anim"/><rect width="7" height="1" x="16" y="15" fill="#000" opacity=".4"/><g transform="translate(17, 13)"><rect width="5" height="1" x="0" y="2" fill="#546E7A"/><rect width="3" height="2" x="1" y="0" fill="#78909C"/><rect width="2" height="1" x="1.5" y="-.5" class="hot-metal"/></g><g fill="#FFC107" transform="translate(19, 12.5)"><use class="spark s1" href="#pixel-spark"/><use class="spark s2" href="#pixel-spark"/><use class="spark s3" href="#pixel-spark"/></g><g fill="#DE886D" class="body-bounce"><rect width="1" height="2" x="3" y="13"/><rect width="1" height="2" x="5" y="13"/><rect width="1" height="2" x="9" y="13"/><rect width="1" height="2" x="11" y="13"/></g><g class="body-bounce"><g class="breathe"><g><g fill="#40C4FF" class="sweat" transform="translate(1, 8)"><rect width="1.5" height="1.5" x="0" y="1"/><rect width="1" height="1" x=".25" y="0"/></g></g><g class="body-squash"><rect width="11" height="7" x="2" y="6" fill="#DE886D"/><g class="eyes-look"><g fill="#000" class="blink"><rect width="1" height="2" x="4" y="8"/><rect width="1" height="2" x="10" y="8"/></g></g><g id="helmet"><g fill="#EFA74A" transform="translate(0.5 1) scale(0.7)"><rect width="6" height="1" x="7" y="0"/><rect width="6" height=