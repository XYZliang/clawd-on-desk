<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes breathe{0%{transform:scale(1,1) translate(0,0)}50%{transform:scale(1.02,.98) translate(0,.5px)}}@keyframes blink{0%,10%{transform:scaleY(1)}5%{transform:scaleY(.1)}}@keyframes sneak-a{0%{transform:rotate(0deg) scaleY(1)}50%{transform:rotate(-25deg) scaleY(.7)}}@keyframes sneak-b{0%{transform:rotate(-25deg) scaleY(.7)}50%{transform:rotate(0deg) scaleY(1)}}@keyframes glass-wobble{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(-3deg) scale(1.05)}}@keyframes body-main{0%,3%,90%,96%{transform:translate(0,0) rotate(0deg)}15%,78%{transform:translate(0,1px) rotate(2deg)}22%,48%{transform:translate(-2px,1px) rotate(2deg)}35%{transform:translate(3px,1px) rotate(2deg)}61%{transform:translate(2px,1px) rotate(2deg)}}@keyframes shadow-main{0%,3%,90%,96%{transform:scaleX(1) translate(0,0);opacity:.5}15%,78%{transform:scale(.9) translate(0,0);opacity:.4}22%,48%{transform:scale(.9) translate(-2px,0);opacity:.4}35%{transform:scale(.9) translate(3px,0);opacity:.4}61%{transform:scale(.9) translate(2px,0);opacity:.4}}@keyframes arm-l{0%,5%,90%{transform:translate(0,0) rotate(0deg)}15%,78%{transform:translate(1px,-1px) rotate(15deg)}}@keyframes arm-r{0%,13%,4%,80%,90%{transform:translate(0,0)}10%,7%,83%,86%{transform:translate(0,-2px)}}@keyframes glass-vis{0%,8.9%,84%{opacity:0}83.9%,9%{opacity:1}}@keyframes eye-squint{0%,10%,86%{transform:scaleY(1)}15%,78%{transform:scaleY(.5)}}@keyframes legs-idle{0%,13.9%,86%{opacity:1}14%,85.9%{opacity:0}}@keyframes legs-sneak{0%,13.9%,86%{opacity:0}14%,85.9%{opacity:1}}.breathe{transform-origin:7.5px 13px;animation:breathe 3.2s infinite ease-in-out}.blink{transform-origin:7.5px 9px;animation:blink 4s infinite linear}.leg-a,.leg-b{animation:sneak-a .5s infinite linear;transform-origin:top center;transform-box:fill-box}.leg-b{animation:sneak-b .5s infinite linear}.glass-wobble{transform-origin:14px 10px;animation:glass-wobble 3s infinite ease-in-out}.body-main{transform-origin:7.5px 15px;animation:body-main 14s infinite ease-in-out}.shadow-main{transform-origin:7.5px 15.5px;animation:shadow-main 14s infinite ease-in-out}.arm-l{transform-origin:1px 10px;animation:arm-l 14s infinite ease-in-out}.arm-r{transform-origin:14px 10px;animation:arm-r 14s infinite ease-in-out}.glass-vis{animation:glass-vis 14s infinite linear}.eye-squint{transform-origin:4.5px 9px;animation:eye-squint 14s infinite ease-in-out}.legs-idle{animation:legs-idle 14s infinite linear}.legs-sneak{animation:legs-sneak 14s infinite linear}</style></defs><g class="shadow-main"><rect width="9" height="1" x="3" y="15" fill="#000"/></g><g fill="#DE886D" class="legs-idle"><rect width="1" height="3" x="3" y="12"/><rect width="1" height="3" x="5" y="12"/><rect width="1" height="3" x="9" y="12"/><rect width="1" height="3" x="11" y="12"/></g><g class="body-main"><g fill="#DE886D" class="legs-sneak" opacity="0"><rect width="1" height="2" x="3" y="13" class="leg-a"/><rect width="1" height="2" x="5" y="13" class="leg-b"/><rect width="1" height="2" x="9" y="13" class="leg-a"/><rect width="1" height="2" x="11" y="13" class="leg-b"/></g><g class="breathe"><rect width="11" height="7" x="2" y="6" fill="#DE886D"/><g class="arm-l"><rect width="2" height="2" x="0" y="9" fill="#DE886D"/></g><g fill="#000" class="blink"><g class="eye-squint"><rect width="1" height="2" x="4" y="8"/></g><rect width="1" height="2" x="10" y="8"/></g><g class="arm-r"><rect width="2" height="2" x="13" y="9" fill="#DE886D"/><g class="glass-vis" opacity="0"><g class="glass-wobble"><g transform="translate(13.5, 9.5)"><polygon fill="#795548" points=".5 1.5 1.5 .5 -1 -2 -2 -1"/><rect width="6" height="6" x="-6" y="-5" fill="#546E7A" rx="2"/><rect width="2" height="3" x="-4" y="-3.5" fill="#000"/><rect width="5" height="5" x="-5.5" y="-4.5" fill="#E0F7FA" opacity=".6" rx="1.5"/><rect width="1.5" height="1.5" x="-4.5" y="-3.5" fill="#FFF" opacity=".8"/></g></g></g></g></g></g></svg>