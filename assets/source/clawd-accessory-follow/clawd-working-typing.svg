<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-15 -25 45 45"><defs><style>@keyframes body-bounce{0%{transform:translateY(0)}50%{transform:translateY(.8px)}}@keyframes breathe{0%{transform:scale(1,1) translate(0,0)}50%{transform:scale(1.02,.98) translate(0,.5px)}}@keyframes shadow-bob{0%{transform:scaleX(1.02);opacity:.5}50%{transform:scaleX(1.05);opacity:.55}}@keyframes type-l{0%{transform:rotate(-5deg)}25%{transform:rotate(-38deg)}50%{transform:rotate(-10deg)}75%{transform:rotate(-30deg)}}@keyframes type-r{0%{transform:rotate(5deg)}25%{transform:rotate(38deg)}50%{transform:rotate(10deg)}75%{transform:rotate(30deg)}}@keyframes eye-code{0%,14%,16%,36%,38%,54%,73%,89%,91%{transform:translate(0,1px) scaleY(.6)}15%,37%,55%,90%{transform:translate(0,1px) scaleY(.1)}57%{transform:translate(-1px,-.5px) scaleY(1)}62%,69%{transform:translate(1.5px,-.5px) scaleY(1)}64%{transform:translate(-.5px,-.3px) scaleY(1)}71%{transform:translate(1px,-.3px) scaleY(.1)}}@keyframes cl1{0%{transform:scaleX(0);opacity:0}3%{transform:scaleX(0);opacity:1}13%{transform:scaleX(1);transform:scaleX(1) translateY(0);opacity:1}78%{transform:scaleX(1) translateY(0);opacity:1}88%{transform:scaleX(1) translateY(-3px);opacity:0}89%{transform:scaleX(0) translateY(0);opacity:0}}@keyframes cl2{0%,14%{transform:scaleX(0);opacity:0}15%{transform:scaleX(0);opacity:1}27%{transform:scaleX(1);transform:scaleX(1) translateY(0);opacity:1}82%{transform:scaleX(1) translateY(0);opacity:1}91%{transform:scaleX(1) translateY(-3px);opacity:0}92%{transform:scaleX(0) translateY(0);opacity:0}}@keyframes cl3{0%,29%{transform:scaleX(0);opacity:0}30%{transform:scaleX(0);opacity:1}42%{transform:scaleX(1);transform:scaleX(1) translateY(0);opacity:1}85%{transform:scaleX(1) translateY(0);opacity:1}93%{transform:scaleX(1) translateY(-3px);opacity:0}94%{transform:scaleX(0) translateY(0);opacity:0}}@keyframes cl4{0%,44%{transform:scaleX(0);opacity:0}45%{transform:scaleX(0);opacity:1}57%{transform:scaleX(1);transform:scaleX(1) translateY(0);opacity:1}88%{transform:scaleX(1) translateY(0);opacity:1}95%{transform:scaleX(1) translateY(-3px);opacity:0}96%{transform:scaleX(0) translateY(0);opacity:0}}@keyframes kflash{0%,70%{opacity:0}35%{opacity:.8}}@keyframes float-data{0%{transform:translateY(0) scale(.5);opacity:0}10%{opacity:.8}}.body-bounce{transform-origin:7.5px 15px;animation:body-bounce .35s infinite ease-in-out}.breathe{transform-origin:7.5px 13px;animation:breathe 3.2s infinite ease-in-out}.arm-l-type{transform-origin:2px 10px;animation:type-l .15s infinite ease-in-out}.arm-r-type{transform-origin:13px 10px;animation:type-r .12s infinite ease-in-out}.eyes-code{transform-origin:7.5px 9px;animation:eye-code 10s infinite ease-in-out}.code-line{transform-box:fill-box;transform-origin:left center}.cl1{animation:cl1 6s infinite}.cl2{animation:cl2 6s infinite}.cl3{animation:cl3 6s infinite}.cl4{animation:cl4 6s infinite}.key-flash{opacity:0}.kf1{animation:kflash .6s infinite}.kf2{animation:kflash .8s infinite;animation-delay:-.25s}.kf3{animation:kflash .5s infinite;animation-delay:-.1s}.kf4{animation:kflash .7s infinite;animation-delay:-.45s}.kf5{animation:kflash .55s infinite;animation-delay:-.3s}.kf6{animation:kflash .9s infinite;animation-delay:-.5s}.data-bit{opacity:0;animation:float-data 1.5s infinite linear}.d1{animation-delay:0s}.d2{animation-delay:-.4s}.d3{animation-delay:-.8s}.d4{animation-delay:-1.2s}.shadow-anim{transform-origin:7.5px 15.5px;animation:shadow-bob .4s infinite ease-in-out}</style><g id="pixel-packet"><rect width="1.5" height="1.5" x="0" y="0"/></g></defs><rect width="9" height="1" x="3" y="15" fill="#000" class="shadow-anim" opacity=".5"/><g fill="#40C4FF"><use x="3" y="7" class="data-bit d1" href="#pixel-packet"/><use x="7" y="8" class="data-bit d2" href="#pixel-packet"/><use x="11" y="7" class="data-bit d3" href="#pixel-packet"/><use x="5" y="8" class="data-bit d4" href="#pixel-packet"/></g><g id="screen" transform="translate(1.25, 0)"><rect width="13.5" height="10.5" x="-.5" y="-6" fill="#1E1E2E" rx=".3"/><rect width="13.5" height="1.2" x="-.5" y="-6" fill="#2D2D3D" rx=".3"/><rect width=".5" height=".4" x=".3" y="-5.6" fill="#FF5F56"/><rect width=".5" height=".4" x="1.2" y="-5.6" fill="#FFBD2E"/><rect width=".5" height=".4" x="2.1" y="-5.6" fill="#27C93F"/><rect width="5" height=".7" x=".5" y="-3.5" fill="#4CAF50" class="code-line cl1" opacity=".8"/><rect width="8" height=".7" x="2" y="-1.8" fill="#4CAF50" class="code-line cl2" opacity=".8"/><rect width="4.5" height=".7" x="2" y="-.1" fill="#40C4FF" class="code-line cl3" opacity=".7"/><rect width="2" height=".7" x=".5" y="1.6" fill="#FFC107" class="code-line cl4" opacity=".7"/></g><g class="body-bounce"><g class="breathe"><g fill="#DE886D"><rect width="1" height="2" x="3" y="13"/><rect width="1" height="2" x="5" y="13"/><rect width="1" height="2" x="9" y="13"/><rect width="1" height="2" x="11" y="13"/><rect width="11" height="7" x="2" y="6"/></g><g fill="#000" class="eyes-code"><rect width="1" height="2" x="4" y="8"/><rect width="1" height="2" x="10" y="8"/></g></g></g><g id="keyboard" transform="translate(-0.5, 11.8)"><rect width="16" height="3.2" x="0" y="0" fill="#455A64" rx=".3"/><g fill="#78909C"><rect width="1" height=".7" x=".5" y=".4"/><rect width="1" height=".7" x="1.8" y=".4"/><rect width="6" height=".7" x="3.5" y=".4" rx=".2"/><rect width="1" height=".7" x="10.2" y=".4"/><rect width="1" height=".7" x="11.5" y=".4"/><rect width="1" height=".7" x="12.8" y=".4"/><rect width="1.3" height=".7" x="14.1" y=".4"/></g><g fill="#78909C"><rect width=".9" height=".7" x=".8" y="1.3"/><rect width=".9" height=".7" x="2" y="1.3"/><rect width=".9" height=".7" x="3.2" y="1.3"/><rect width=".9" height=".7" x="4.4" y="1.3"/><rect width=".9" height=".7" x="5.6" y="1.3"/><rect width=".9" height=".7" x="6.8" y="1.3"/><rect width=".9" height=".7" x="8" y="1.3"/><rect width=".9" height=".7" x="9.2" y="1.3"/><rect width=".9" height=".7" x="10.4" y="1.3"/><rect width